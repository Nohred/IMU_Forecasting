repos:
  # 1. Hooks estándar de Git y validaciones generales
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace         # Elimina espacios en blanco al final de las líneas
      - id: end-of-file-fixer           # Asegura que los archivos terminen con una línea en blanco
      - id: check-yaml                  # Valida la sintaxis de tus archivos .yaml (como docker-compose.yml)
      - id: check-added-large-files     # Evita commitear accidentalmente archivos gigantes
        args: ['--maxkb=5000']          # Límite de 5MB (ideal para no subir weights .pth o .csv enteros)

  # 2. Ordenamiento de importaciones (isort)
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]    # Perfil compatible con Black para evitar conflictos

  # 3. Formateo de código (Black)
  - repo: https://github.com/psf/black
    rev: 23.10.1
    hooks:
      - id: black
        args: ["--line-length=88"]

  # 4. Análisis estático y calidad de código (Flake8)
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [
          "--max-line-length=88", 
          "--extend-ignore=E203,E501,W503" # Ignora errores de longitud que Black ya maneja
        ]